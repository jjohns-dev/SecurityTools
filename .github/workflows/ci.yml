name: ci
run-name: ci

on:
  pull_request:
    branches: ["*"]
    #paths-ignore:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/ci.yml@v2
    with:
      # Cross-platform *.tests.ps1 run on Linux only - deliberate, see #166. To also verify
      # them on Windows, drop pesterScope from the windows leg (harness default All) and re-derive
      # its minTests from the measured executed count.
      # ubuntu minTests: 996 executed (997 collected - 1 disabled) - min(floor(996 * 0.05), 10) = 996 - 10
      os-matrix: >-
        [{"os":"ubuntu-latest","pesterScope":"CrossPlatform","minTests":986},
         {"os":"windows-latest","pesterScope":"WindowsOnly","minTests":20}]
    permissions:
      contents: read
      checks: write
