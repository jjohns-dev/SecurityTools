name: release
run-name: release

on:
  pull_request:
    branches: ["*"]
  push:
    tags:
      - "v[0-9].[0-9]+.[0-9]+" # v1.0.0
      #- "v[0-9].[0-9]+.[0-9]+-rc[0-9]+" # v1.0.0-rc01
    branches: [main]
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - .gitignore
      - .github/**

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/release.yml@v2
    with:
      dry-run: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write
